<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Каменный Предел</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
  html, body { margin:0; height:100%; }
  #map { width:100%; height:100%; }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>

const width = 3445;
const height = 2297;

const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 2
});

const bounds = [[0,0], [height, width]];

L.imageOverlay('KPRegMap.jpg', bounds).addTo(map);
map.fitBounds(bounds);

</script>
</body>
</html>
