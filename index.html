<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>DND Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    height: 100%;
}

#map {
    height: 100%;
    width: 100%;
}

/* Sidebar */
#sidebar {
    position: fixed;
    left: -400px;
    top: 0;
    width: 400px;
    height: 100%;
    background: #1e1e1e;
    color: white;
    overflow-y: auto;
    padding: 20px;
    transition: 0.3s;
    z-index: 1000;
    box-shadow: 2px 0 10px rgba(0,0,0,0.5);
}

#sidebar.open {
    left: 0;
}

#sidebar h2 {
    margin-top: 0;
}

#sidebar img {
    width: 100%;
    margin-bottom: 10px;
    border-radius: 6px;
}

#closeSidebar {
    background: none;
    color: white;
    border: none;
    font-size: 18px;
    cursor: pointer;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
    <button id="closeSidebar">✖ Закрыть</button>
    <div id="sidebarContent"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="map.js"></script>

</body>
</html>
